name: Repository Stats
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thelightway24
          template: terminal
          config_timezone: Asia/Seoul
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 15
          plugin_activity_days: 0
          plugin_activity_filter: pr, issue
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
