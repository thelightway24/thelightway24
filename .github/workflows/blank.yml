name: Update Contributions
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Contribution List
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          script: |
            const blacklistPatterns = [
              /^talkpick.*/i,
              /^test.*/i
            ];

            const query = `is:pr author:thelightway24 -user:thelightway24 is:public sort:created-desc`;
            const result = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 100
            });

            const repos = {};
            
            for (const pr of result.data.items) {
              const repoUrl = pr.repository_url;
              const fullRepoName = repoUrl.replace('https://api.github.com/repos/', '');
              const [owner, repoName] = fullRepoName.split('/');
              
              if (blacklistPatterns.some(pattern => pattern.test(repoName))) continue;

              if (!repos[fullRepoName]) {
                repos[fullRepoName] = [];
              }
              
              let statusIcon = '🔘';
              
              if (pr.pull_request.merged_at) {
                statusIcon = '💜'; 
              } else if (pr.state === 'open') {
                statusIcon = '💙';
              } else {
                // [탐정 로직 개선: 서버 사이드 정밀 검색]
                try {
                  let found = false;
                  
                  // 전략: "커밋 메시지에 PR 번호가 있고" AND "작성자가 나인 경우"를 서버에 직접 질의
                  // 이렇게 하면 최근 100개 제한에 걸리지 않고, 전체 역사에서 검색합니다.
                  
                  // 1. Committer가 'thelightway24' 이면서 내용에 'PR번호'가 있는가?
                  // 쿼리 예시: repo:spring-projects/spring-batch committer:thelightway24 "4944"
                  const committerQuery = `repo:${fullRepoName} committer:thelightway24 "${pr.number}"`;
                  const committerResult = await github.rest.search.commits({
                    q: committerQuery,
                    per_page: 1 // 존재 여부만 알면 됨
                  });

                  if (committerResult.data.total_count > 0) {
                    found = true;
                  } else {
                    // 2. Author가 'thelightway24' 이면서 내용에 'PR번호'가 있는가?
                    // 쿼리 예시: repo:spring-projects/spring-batch author:thelightway24 "4944"
                    const authorQuery = `repo:${fullRepoName} author:thelightway24 "${pr.number}"`;
                    const authorResult = await github.rest.search.commits({
                      q: authorQuery,
                      per_page: 1
                    });
                    
                    if (authorResult.data.total_count > 0) {
                      found = true;
                    } else {
                      // [보너스] 혹시 번호 말고 "제목"으로 검색해야 나올 수도 있음 (번호 누락 시)
                      // Author가 나이면서 "제목의 핵심 단어"가 포함된 경우
                      // (단, 제목이 너무 길면 검색이 잘 안되니 앞부분만 잘라서 검색도 가능하지만, 일단 전체 제목 시도)
                      const titleQuery = `repo:${fullRepoName} author:thelightway24 "${pr.title.replace(/"/g, '')}"`;
                       try {
                        const titleResult = await github.rest.search.commits({
                          q: titleQuery,
                          per_page: 1
                        });
                        if (titleResult.data.total_count > 0) found = true;
                      } catch(e) { /* 제목 검색 실패는 무시 */ }
                    }
                  }

                  if (found) {
                     statusIcon = '💜';
                  }

                } catch (e) {
                  console.log(`Search failed for ${fullRepoName}: ${e.message}`);
                }
              }
              
              repos[fullRepoName].push({
                title: pr.title,
                url: pr.html_url,
                date: pr.created_at.split('T')[0],
                status: statusIcon
              });
            }

            let content = `### 🚀 Open Source Contributions\n\n`;
            content += `> 💜 Merged (incl. Squashed) | 💙 Open | 🔘 Closed\n\n`;
            
            for (const [repo, prs] of Object.entries(repos)) {
              content += `#### 📦 [${repo}](https://github.com/${repo})\n`;
              prs.forEach(pr => {
                content += `- ${pr.status} [${pr.title}](${pr.url}) (${pr.date})\n`;
              });
              content += `\n`;
            }

            const fs = require('fs');
            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            
            const startTag = '';
            const endTag = '';
            
            const newReadme = readme.replace(
              new RegExp(`${startTag}[\\s\\S]*${endTag}`),
              `${startTag}\n${content}\n${endTag}`
            );
            fs.writeFileSync(readmePath, newReadme);

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update contribution list"
          git push
