name: Update Contributions
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Contribution List
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          script: |
            const blacklistPatterns = [
              /^talkpick.*/i,
              /^test.*/i
            ];

            const query = `is:pr author:thelightway24 -user:thelightway24 is:public sort:created-desc`;
            const result = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 100
            });

            const repos = {};
            
            for (const pr of result.data.items) {
              const repoUrl = pr.repository_url;
              const fullRepoName = repoUrl.replace('https://api.github.com/repos/', '');
              const [owner, repoName] = fullRepoName.split('/');
              
              if (blacklistPatterns.some(pattern => pattern.test(repoName))) continue;

              if (!repos[fullRepoName]) {
                repos[fullRepoName] = [];
              }
              
              let statusIcon = '🔘';
              
              if (pr.pull_request.merged_at) {
                statusIcon = '💜'; 
              } else if (pr.state === 'open') {
                statusIcon = '💙';
              } else {
                // [탐정 로직 강화됨]
                try {
                  const recentCommits = await github.rest.repos.listCommits({
                    owner: owner,
                    repo: repoName,
                    // author: 'thelightway24', // <-- [삭제] Maintainer가 커밋했을 수 있으므로 내 아이디 필터 제거
                    per_page: 50 // [수정] 대형 프로젝트는 커밋이 많으므로 범위를 50개로 확장
                  });
                  
                  // 커밋 메시지 분석
                  const isSquashed = recentCommits.data.some(commit => 
                    commit.commit.message.includes(`#${pr.number}`) ||   // 일반적인 GitHub 패턴 (#123)
                    commit.commit.message.includes(`gh-${pr.number}`) || // Spring 프로젝트 패턴 (gh-123)
                    commit.commit.message.includes(pr.title)             // 제목 포함 여부
                  );

                  if (isSquashed) {
                    statusIcon = '💜';
                  }
                } catch (e) {
                  console.log(`Failed to check commits for ${fullRepoName}: ${e.message}`);
                }
              }
              
              repos[fullRepoName].push({
                title: pr.title,
                url: pr.html_url,
                date: pr.created_at.split('T')[0],
                status: statusIcon
              });
            }

            let content = `### 🚀 Open Source Contributions\n\n`;
            content += `> 💜 Merged (incl. Squashed) | 💙 Open | 🔘 Closed\n\n`;
            
            for (const [repo, prs] of Object.entries(repos)) {
              content += `#### 📦 [${repo}](https://github.com/${repo})\n`;
              prs.forEach(pr => {
                content += `- ${pr.status} [${pr.title}](${pr.url}) (${pr.date})\n`;
              });
              content += `\n`;
            }

            const fs = require('fs');
            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const startTag = '<!-- CONTRIBUTIONS:START -->';
            const endTag = '<!-- CONTRIBUTIONS:END -->';
            
            
            const newReadme = readme.replace(
              new RegExp(`${startTag}[\\s\\S]*${endTag}`),
              `${startTag}\n${content}\n${endTag}`
            );
            fs.writeFileSync(readmePath, newReadme);

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update contribution list"
          git push
