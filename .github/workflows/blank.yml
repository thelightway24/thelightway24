name: Update Contributions
on:
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Contribution List
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          script: |
            const blacklistPatterns = [
              /^talkpick.*/i,
              /^yakplus.*/i,
              /^WooBooung.*/i,
              /^DIDIM.*/i
            ];

            const query = `is:pr author:thelightway24 -user:thelightway24 is:public sort:created-desc`;
            const result = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 100
            });

            const repos = {};
            
            for (const pr of result.data.items) {
              const repoUrl = pr.repository_url;
              const fullRepoName = repoUrl.replace('https://api.github.com/repos/', '');
              const [owner, repoName] = fullRepoName.split('/');
              
              if (blacklistPatterns.some(pattern => pattern.test(repoName))) continue;

              if (!repos[fullRepoName]) {
                repos[fullRepoName] = [];
              }
              
              let statusIcon = '🔘';
              
              if (pr.pull_request.merged_at) {
                statusIcon = '💜'; 
              } else if (pr.state === 'open') {
                statusIcon = '💙';
              } else {
                try {
                  let found = false;
                  
                  const checkCommit = async (target) => {
                    if (!target) return false;
                    
                    const cQuery = `repo:${fullRepoName} committer:thelightway24 "${target}"`;
                    const cResult = await github.rest.search.commits({ q: cQuery, per_page: 1 });
                    if (cResult.data.total_count > 0) return true;
                    
                    const aQuery = `repo:${fullRepoName} author:thelightway24 "${target}"`;
                    const aResult = await github.rest.search.commits({ q: aQuery, per_page: 1 });
                    if (aResult.data.total_count > 0) return true;
                    
                    return false;
                  };

                  found = await checkCommit(pr.number);

                  if (!found && pr.body) {
                    const issueRegex = /(?:fix|fixes|close|closes|resolve|resolves|related|ref|issue).{0,10}#(\d+)/gi;
                    let match;
                    const linkedIssues = [];
                    
                    while ((match = issueRegex.exec(pr.body)) !== null) {
                      linkedIssues.push(match[1]);
                    }
                    
                    for (const issueNum of linkedIssues) {
                      if (await checkCommit(issueNum)) {
                        found = true;
                        break; 
                      }
                    }
                  }

                  if (found) {
                     statusIcon = '💜';
                  }

                } catch (e) {
                  console.log(`Search failed for ${fullRepoName}: ${e.message}`);
                }
              }
              
              repos[fullRepoName].push({
                title: pr.title,
                url: pr.html_url,
                date: pr.created_at.split('T')[0],
                status: statusIcon
              });
            }

            let content = `### 🚀 Open Source Contributions\n\n`;
            content += `> 💜 Merged (incl. Squashed) | 💙 Open | 🔘 Closed\n\n`;
            
            for (const [repo, prs] of Object.entries(repos)) {
              content += `#### 📦 [${repo}](https://github.com/${repo})\n`;
              prs.forEach(pr => {
                content += `- ${pr.status} [${pr.title}](${pr.url}) (${pr.date})\n`;
              });
              content += `\n`;
            }

            const fs = require('fs');
            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            
            const startTag = '';
            const endTag = '';
            
            const newReadme = readme.replace(
              new RegExp(`${startTag}[\\s\\S]*${endTag}`),
              `${startTag}\n${content}\n${endTag}`
            );
            fs.writeFileSync(readmePath, newReadme);

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update contribution list"
          git push
