name: Repository Stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thelightway24
          template: classic
          base: ""
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: repositories
          plugin_repositories: yes
          plugin_repositories_featured: spring-projects/spring-framework, spring-projects/spring-batch, dev-five-git/braillify
          plugin_repositories_order: featured, pinned, random
